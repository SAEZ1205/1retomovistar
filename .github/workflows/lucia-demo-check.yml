name: LucIA demo build check

on:
  push:
    branches:
      - feature/lucia-dataset-demo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE/FUENTE_BASE_ANTIGUA_NO_USADA_EN_LA_DEMO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MI_RECIBO_INTELIGENTE_FINAL_IGUAL_SITE/FUENTE_BASE_ANTIGUA_NO_USADA_EN_LA_DEMO/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package local demo
        run: |
          zip -r ../../LUCIA_DATASET_DEMO_LOCAL.zip . -x 'node_modules/*' 'dist/*' '.env.local' '.env' '*.log'
      - name: Upload local demo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LUCIA_DATASET_DEMO_LOCAL
          path: LUCIA_DATASET_DEMO_LOCAL.zip
          if-no-files-found: error
